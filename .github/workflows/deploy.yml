name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # botão pra rodar na mão, na aba Actions

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false # não interrompe um deploy no meio (obs: eu que tô escrevendo, não o claude)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/chechout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s/n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s/n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts # não aguento mais escrever

      - name: Enviar para a VM
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: rsync -az --delete out/ "$TARGET:/var/www/portfolio/"
