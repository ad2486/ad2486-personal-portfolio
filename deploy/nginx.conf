# Next.js static export (trailingSlash: true) servido de /var/www/portfolio.
# Depois de ativar, `sudo certbot --nginx -d seu-dominio.com.br` adiciona o bloco 443 e o redirect.
# Idioma inicial pelo Accept-Language do navegador (pt e o padrao).
# `map` fica fora do server; sites-available e conf.d ja sao incluidos no contexto http.
map $http_accept_language $lang_home {
    default  /pt/;
    ~*^en    /en/;
    ~*^de    /de/;
}

server {
    listen 80;
    listen [::]:80;
    server_name seu-dominio.com.br;

    root /var/www/portfolio;
    index index.html;

    # Zonas em deploy/limits.conf (contexto http).
    limit_req  zone=req_ip burst=50 nodelay;
    limit_conn conn_ip 20;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    # A raiz nao tem pagina propria: manda para /pt/, /en/ ou /de/.
    location = / {
        add_header Vary "Accept-Language" always;
        return 302 $lang_home;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Assets com hash no nome: cache longo.
    # add_header aqui substitui os do server, por isso os de seguranca se repetem.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
